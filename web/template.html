<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WordPress Plugin Watch · Catálogo</title>
<style>
:root{font:16px/1.5 system-ui,sans-serif;color:#172c3b;background:#f2f5f7}body{margin:0}main{max-width:1200px;margin:auto;padding:32px 22px}header{border-top:5px solid #137665;padding:24px 0}h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;margin:15px 0}a{color:#075e83}button,select,input{font:inherit;padding:10px;border:1px solid #9dabb4;border-radius:5px;background:white;color:inherit}button{cursor:pointer}button:hover{background:#e2f3ef}:focus-visible{outline:3px solid #b24d00;outline-offset:3px}.bar{display:flex;gap:15px;flex-wrap:wrap;align-items:end}.filters{background:white;border:1px solid #cbd5dc;padding:20px;border-radius:10px;margin:24px 0}label{display:grid;gap:5px;font-weight:600;flex:1;min-width:170px}p{max-width:85ch}.muted{color:#475d6a}.table{overflow:auto;background:white;border:1px solid #cbd5dc;border-radius:10px}table{border-collapse:collapse;width:100%;min-width:800px}th,td{text-align:left;padding:15px;border-bottom:1px solid #dce3e8;vertical-align:top}th{background:#e7efef}td small{display:block;color:#475d6a}.badge{display:inline-block;background:#e7f1ee;padding:2px 7px;border-radius:4px;font-size:.8rem;margin:2px}.pager{display:flex;gap:15px;align-items:center;justify-content:space-between;margin:20px 0}footer{border-top:1px solid #cbd5dc;margin-top:40px;padding-top:20px}#count{font-weight:700}caption{text-align:left;padding:15px;font-weight:600}
</style>
<main><header><div class="bar"><a href="https://github.com/eligeunaweb/wp-plugin-watch">GitHub ↗</a><button id="language" type="button">English</button></div><h1>WordPress Plugin Watch</h1><p id="intro"></p><p id="freshness" class="muted"></p></header>
<section class="filters bar" aria-label="Filters"><label><span id="searchLabel"></span><input id="search" type="search"></label><label><span id="categoryLabel"></span><select id="category"></select></label><label><span id="statusLabel"></span><select id="status"></select></label><label><span id="installLabel"></span><select id="installs"><option value="0">0+</option><option value="1000">1.000+</option><option value="10000">10.000+</option><option value="100000">100.000+</option></select></label><label><span id="ageLabel"></span><select id="age"><option value="0">—</option><option value="730">≥730</option><option value="1095">≥1095</option><option value="1825">≥1825</option></select></label><label><span id="sortLabel"></span><select id="sort"></select></label><button id="reset" type="button"></button></section>
<div class="bar"><p id="count" role="status" aria-live="polite"></p><button id="csv" type="button">CSV ↓</button></div>
<div class="table"><table><caption id="caption"></caption><thead><tr id="head"></tr></thead><tbody id="rows"></tbody></table></div><div class="pager"><button id="prev" type="button"></button><span id="page"></span><button id="next" type="button"></button></div>
<footer><p id="notice"></p><a href="https://github.com/eligeunaweb/wp-plugin-watch/blob/main/docs/METHODOLOGY.md">Metodología / Methodology</a></footer><noscript>Activa JavaScript o consulta las listas en GitHub. Enable JavaScript or use the GitHub lists.</noscript></main>
<script type="application/json" id="data">__CATALOG_DATA__</script>
<script>
'use strict';
const data=JSON.parse(document.getElementById('data').textContent),$=id=>document.getElementById(id);
let lang='es',page=0,filtered=[];const size=50;
const words={es:{intro:'Explora señales de mantenimiento de plugins de WordPress. Busca, combina filtros y consulta las fuentes antes de tomar una decisión.',searchLabel:'Buscar nombre o slug',categoryLabel:'Categoría orientativa',statusLabel:'Estado / consulta',installLabel:'Instalaciones mínimas',ageLabel:'Días sin actualizar',sortLabel:'Ordenar por',reset:'Limpiar filtros',prev:'Anterior',next:'Siguiente',caption:'Catálogo de plugins',all:'Todos',sort:['Más instalaciones','Menos instalaciones','Actualización más antigua','Actualización más reciente','Nombre A–Z'],heads:['Plugin / categorías','Instalaciones¹','Última actualización','Estado','Verificado'],status:{no_updates_2y:'Sin actualizar ≥730 días',updated_within_2y:'Actualizado hace <730 días',closed:'Cerrado',not_found:'No encontrado',unknown:'Sin datos',error:'Error de consulta'},notice:'¹ Cifras aproximadas publicadas por WordPress.org. Hist.: dato histórico. La antigüedad no demuestra abandono ni vulnerabilidad. Categorías automáticas por palabras clave, sin revisión humana. Una categoría de seguridad describe la función del plugin, no su fiabilidad.',results:'resultados',run:'Datos consultados',empty:'No hay resultados. Prueba otros filtros.'},en:{intro:'Explore WordPress plugin maintenance signals. Search, combine filters and check the sources before deciding.',searchLabel:'Search name or slug',categoryLabel:'Heuristic category',statusLabel:'Status / check',installLabel:'Minimum installs',ageLabel:'Days without updates',sortLabel:'Sort by',reset:'Clear filters',prev:'Previous',next:'Next',caption:'Plugin catalogue',all:'All',sort:['Most installs','Fewest installs','Oldest update','Newest update','Name A–Z'],heads:['Plugin / categories','Installs¹','Last updated','Status','Verified'],status:{no_updates_2y:'No updates ≥730 days',updated_within_2y:'Updated within 730 days',closed:'Closed',not_found:'Not found',unknown:'Unknown',error:'Check failed'},notice:'¹ Approximate figures published by WordPress.org. Hist.: historical value. Age does not establish abandonment or vulnerability. Keyword-based categories have not been reviewed. The security category describes plugin function, not trustworthiness.',results:'results',run:'Data checked',empty:'No results. Try different filters.'}};
function option(select,value,text){const o=document.createElement('option');o.value=value;o.textContent=text;select.append(o)}
function labels(){const w=words[lang];document.documentElement.lang=lang;for(const id of ['intro','searchLabel','categoryLabel','statusLabel','installLabel','ageLabel','sortLabel','reset','prev','next','caption','notice'])$(id).textContent=w[id];$('language').textContent=lang==='es'?'English':'Español';$('freshness').textContent=w.run+': '+data.generated_at+' · '+data.plugins.length+' plugins';for(const id of ['category','status','sort']){const old=$(id).value;$(id).replaceChildren();if(id!=='sort')option($(id),'',w.all);if(id==='category')for(const [key,names]of Object.entries(data.category_labels))option($(id),key,names[lang==='en'?1:0]);if(id==='status')for(const [key,name]of Object.entries(w.status))option($(id),key,name);if(id==='sort')w.sort.forEach((v,i)=>option($(id),String(i),v));if([...$(id).options].some(o=>o.value===old))$(id).value=old;}$('head').replaceChildren();for(const h of w.heads){const th=document.createElement('th');th.scope='col';th.textContent=h;$('head').append(th)}render()}
function selectRows(){const q=$('search').value.trim().toLocaleLowerCase(),cat=$('category').value,status=$('status').value,min=Number($('installs').value);const rows=data.plugins.filter(r=>(!q||((r.name||'')+' '+r.slug).toLocaleLowerCase().includes(q))&&(!cat||r.categories.includes(cat))&&(!status||(status==='error'?r.check_status==='error':r.maintenance===status))&&(r.active_installs||0)>=min&&(!$('age').value||$('age').value==='0'||(r.last_updated&&(Date.parse(data.generated_at)-Date.parse(r.last_updated))/86400000>=Number($('age').value))));const sort=$('sort').value;rows.sort((a,b)=>{let cmp=0;if(sort==='4')cmp=(a.name||a.slug).localeCompare(b.name||b.slug,lang);else if(sort==='2'||sort==='3'){if(!a.last_updated)return b.last_updated?1:0;if(!b.last_updated)return -1;cmp=a.last_updated.localeCompare(b.last_updated)*(sort==='2'?1:-1)}else cmp=((a.active_installs||0)-(b.active_installs||0))*(sort==='1'?1:-1);return cmp||a.slug.localeCompare(b.slug)});return rows}
function render(){const w=words[lang];filtered=selectRows();page=Math.min(page,Math.max(0,Math.ceil(filtered.length/size)-1));$('count').textContent=filtered.length+' / '+data.plugins.length+' '+w.results;$('rows').replaceChildren();for(const r of filtered.slice(page*size,(page+1)*size)){const tr=document.createElement('tr'),td=document.createElement('td'),a=document.createElement('a');a.textContent=r.name||r.slug;a.href='https://wordpress.org/plugins/'+encodeURIComponent(r.slug)+'/';td.append(a);const slug=document.createElement('small');slug.textContent=r.slug;td.append(slug);for(const cat of r.categories){const tag=document.createElement('span');tag.className='badge';tag.textContent=data.category_labels[cat][lang==='en'?1:0];td.append(tag)}tr.append(td);const hist=['closed','not_found'].includes(r.directory_status)?' (hist.)':'';for(const text of [r.active_installs==null?'—':r.active_installs.toLocaleString(lang)+'+'+hist,r.last_updated?.slice(0,10)||'—',(r.check_status==='error'?w.status.error+' · ':'')+(w.status[r.maintenance]||w.status.unknown),r.verified_at||'—']){const cell=document.createElement('td');cell.textContent=text;tr.append(cell)}$('rows').append(tr)}if(!filtered.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.textContent=w.empty;tr.append(td);$('rows').append(tr)}$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=filtered.length;$('page').textContent=(page+1)+' / '+Math.max(1,Math.ceil(filtered.length/size))}
for(const id of ['search','category','status','installs','age','sort'])$(id).addEventListener('input',()=>{page=0;render()});$('language').onclick=()=>{lang=lang==='es'?'en':'es';labels()};$('prev').onclick=()=>{page--;render()};$('next').onclick=()=>{page++;render()};$('reset').onclick=()=>{for(const id of ['search','category','status'])$(id).value='';$('sort').value='0';$('installs').value='0';$('age').value='0';page=0;render()};
$('csv').onclick=()=>{const fields=['slug','name','categories','active_installs','last_updated','maintenance','check_status','verified_at'];const quote=v=>'"'+String(v??'').replace(/^[\s]*[=+@-]/,"'$&").replaceAll('"','""')+'"';const text=[fields,...filtered.map(r=>fields.map(f=>Array.isArray(r[f])?r[f].join(';'):r[f]))].map(row=>row.map(quote).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='wp-plugin-watch-filtered.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};labels();
</script></html>
